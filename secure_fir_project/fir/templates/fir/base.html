<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure FIR</title><style>
body{font-family:Arial;margin:0;background:#f3f6fb;color:#17243a}header{background:#14376b;color:white;padding:16px 5%;display:flex;justify-content:space-between}a{color:#1559a6}header a{color:white;margin-left:14px}.wrap{max-width:1000px;margin:25px auto;padding:0 15px}.card{background:white;padding:22px;border-radius:12px;margin:14px 0;box-shadow:0 3px 12px #0001}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd5e2;border-radius:6px}textarea{min-height:110px}.btn{background:#1559a6;color:white;padding:10px 14px;border:0;border-radius:6px;text-decoration:none;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}.msg{padding:12px;background:#e8f5e9;margin:10px 0}.err{background:#ffebee}.small{color:#65748b;font-size:.9rem}</style></head><body><header><b>🔐 Secure FIR System</b><nav>{% if user.is_authenticated %}<a href="/">Dashboard</a><a href="/fir/new/">Register FIR</a><a href="/logout/">Logout</a>{% endif %}</nav></header><main class="wrap">{% for m in messages %}<div class="msg {% if m.tags == 'error' %}err{% endif %}">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
